<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c2c">
<title>Pallone nella Spacca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1a1c2c;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const H = 320;           // risoluzione logica verticale (pixel art)
let W = 180;
const GROUND = 40;       // altezza in pixel della strada sotto lo schermo
const WALL_TOP = 2100;   // altezza del muro (unità; 100 = 1 metro)
const MAX_H = 2100;      // altezza massima raggiungibile col tiro
const BRIDGE = 1700;     // sbalzo del palazzo di destra che chiude la spacca
const BRIDGE_T = 70;
const RIGHT_TOP = 1960;  // tetto del palazzo di destra
const G = 800;           // gravità
const CATCH_VY = 250;    // sotto questa velocità verticale il pallone si incastra
const CATCH_DY = 5;      // tolleranza in altezza sulla strozzatura
const CATCH_DX = 2.6;    // tolleranza laterale: devi stare sul lato aperto
const CATCH_VX = 55;     // se va troppo veloce di lato non si incastra
const BALL_R = 3.5;
const FONT = '"Press Start 2P", monospace';

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  W = Math.round(Math.max(160, Math.min(240, H * vw / vh)));
  cv.width = W; cv.height = H;
  const s = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
  if (game) buildWall();
}

// ================== AUDIO ==================
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
function beep(f, d=0.1, type='square', f2=null, vol=0.08){
  if(!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  kick(){ beep(140,0.12,'square',60,0.15); },
  stuck(){ beep(523,0.08); setTimeout(()=>beep(659,0.08),80); setTimeout(()=>beep(784,0.16),160); },
  miss(){ beep(300,0.35,'sawtooth',80,0.08); },
  knock(){ beep(900,0.06,'square',200,0.1); },
  bounce(){ beep(220,0.04,'triangle',null,0.06); },
  tick(){ beep(880,0.03,'square',null,0.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18),i*140)); }
};

// ================== DATI ==================
const KIDS = [
  { name:'ROSSO',  shirt:'#e43b44', shorts:'#262b44', hair:'#3e2731', skin:'#f2c6a0' },
  { name:'BLU',    shirt:'#0099db', shorts:'#262b44', hair:'#feae34', skin:'#e8b796' },
  { name:'VERDE',  shirt:'#3fbf3f', shorts:'#733e39', hair:'#181425', skin:'#c28569' },
  { name:'GIALLO', shirt:'#fee761', shorts:'#3a4466', hair:'#b86f50', skin:'#f2c6a0' },
];

let game = null;     // stato della partita
let state = 'menu';  // menu | aim | flight | result | over
let menu = { players:2, rounds:3 };
let best = 0;
try { best = +localStorage.getItem('spacca_best') || 0; } catch(e){}

// la spacca tra i due palazzi: centro e mezza larghezza in funzione dell'altezza
function gapC(y){ return W/2 + 3*Math.sin(y*0.003 + game.s1) + 1.5*Math.sin(y*0.011 + game.s2); }
function gapHW(y){ return 11 - 3.5*Math.min(1, y/BRIDGE); }
function inGap(x, y){ return y < BRIDGE && Math.abs(x - gapC(y)) < gapHW(y) - 1; }

function newGame(){
  game = {
    s1: Math.random()*6.28, s2: Math.random()*6.28,
    players: [], round: 1, turn: 0,
    pockets: [], falling: [], particles: [], birds: [], popups: [], solids: [], t: 0,
  };
  const spots = [W*0.22, W*0.78, W*0.36, W*0.64];
  for (let i=0;i<menu.players;i++) game.players.push({ kid:KIDS[i], x: spots[i] });
  // strozzature nella spacca (cornicioni/tubi) dove il pallone si incastra
  let y = 80;
  while (y < BRIDGE - 60){
    game.pockets.push({ x: 0, y, owner: -1, side: Math.random()<0.5 ? -1 : 1, pipe: Math.random()<0.35 });
    y += 85 + Math.random()*65;
  }
  // il posto d'oro: proprio sotto lo sbalzo
  game.pockets.push({ x: 0, y: BRIDGE - 6, owner: -1, side: Math.random()<0.5 ? -1 : 1, pipe: false, top: true });
  buildWall();
  startTurn();
}

function score(i){
  let m = 0;
  for (const p of game.pockets) if (p.owner === i) m = Math.max(m, p.y);
  return m;
}
const meters = y => (y/100).toFixed(1) + 'm';

// ================== PALAZZI E SPACCA (pre-renderizzati) ==================
let wallCv = null;
const WALL_IMG_H = WALL_TOP + 60;
function rnd(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }
function setPocketX(p){
  const c = gapC(p.y), hw = gapHW(p.y);
  p.x = p.side < 0 ? c + hw - BALL_R - 0.5 : c - hw + BALL_R + 0.5;
}
function buildWall(){
  game.pockets.forEach(setPocketX);
  game.solids = [];
  wallCv = document.createElement('canvas');
  wallCv.width = W; wallCv.height = WALL_IMG_H;
  const w = wallCv.getContext('2d');
  const R = rnd(4242);
  const row = wy => WALL_TOP + 40 - wy;
  const rect = (c, x, y, ww, hh) => { w.fillStyle = c; w.fillRect(Math.round(x), Math.round(y), ww, hh); };
  // cielo
  rect('#7fb2e0', 0, 0, W, WALL_IMG_H);
  rect('#9cc6ea', 0, row(RIGHT_TOP) - 60, W, 60);
  // facciate e fessura, riga per riga
  for (let y = 0; y < WALL_TOP; y++){
    const c = gapC(y), hw = gapHW(y), gl = Math.round(c - hw), gr = Math.round(c + hw), r = row(y);
    rect('#8c6d6a', 0, r, gl, 1);                                  // palazzo sinistro
    rect('#77595a', gl - 4, r, 4, 1);                               // spigolo in ombra
    if (y < RIGHT_TOP){ rect('#8c6d6a', gr, r, W - gr, 1); rect('#6e5254', gr, r, 3, 1); }
    // dentro la spacca
    if (y < BRIDGE){
      let col = '#2a2130';
      if (y < 520) col = y < 70 ? '#3a2e34' : '#253b2c';
      rect(col, gl, r, gr - gl, 1);
    } else if (y < RIGHT_TOP) rect('#6e5254', gl, r, gr - gl, 1);
  }
  // alberi in fondo alla spacca, scale e lampioni
  for (let i = 0; i < 160; i++){
    const y = 70 + R()*450, c = gapC(y), hw = gapHW(y);
    rect(R() < 0.5 ? '#2f5a35' : '#3e7a3e', c - hw + R()*(hw*2 - 3), row(y), 3, 2);
  }
  for (let y = 4; y < 70; y += 6){ const c = gapC(y), hw = gapHW(y); rect('#5b4a48', c - hw, row(y), hw*2, 2); }
  for (const ly of [95, 150]){
    const c = gapC(ly), hw = gapHW(ly);
    rect('#3a2e34', c - hw, row(ly) + 1, 3, 1);
    rect('#fff6c8', c - hw + 2, row(ly) - 2, 4, 4);
    rect('rgba(255,240,180,0.25)', c - hw + 1, row(ly) - 4, 7, 8);
  }
  // piani: finestre, balconi rossi, condizionatori
  const floor = (x, fy, wid) => {
    const r = row(fy);
    game.solids.push({ x0: x - 3, x1: x + wid + 3, y0: fy - 4, y1: fy + 9, kind: 'balcone' });
    rect('#5a3a30', x - 1, r - 23, wid + 2, 24);
    rect('#3b3040', x, r - 22, wid, 22);
    rect('#a8652e', x, r - 22, wid, 8);
    for (let k = 0; k < 8; k += 2) rect('#8a4f24', x, r - 22 + k, wid, 1);
    // balcone
    rect('#d8d0c8', x - 3, r, wid + 6, 3);
    rect('#a89c94', x - 3, r + 3, wid + 6, 1);
    rect('#d8343f', x - 3, r - 9, wid + 6, 1);
    for (let k = 0; k <= wid + 6; k += 3) rect('#d8343f', x - 3 + k, r - 9, 1, 9);
    rect('rgba(216,52,63,0.35)', x - 3, r - 8, wid + 6, 8);
  };
  const ac = (x, y) => { const r = row(y); game.solids.push({ x0: x, x1: x + 10, y0: y - 7, y1: y, kind: 'clima' }); rect('#e8e8e8', x, r, 10, 7); rect('#9aa0a8', x + 2, r + 1, 5, 5); rect('#e8e8e8', x + 4, r + 3, 1, 1); };
  for (let fy = 300; fy < WALL_TOP - 120; fy += 260){
    const cL = gapC(fy) - gapHW(fy);
    if (cL > 40) floor(6, fy, 20);
    if (cL > 70) floor(cL - 34, fy, 18);
    if (fy < RIGHT_TOP - 140){
      const cR = gapC(fy) + gapHW(fy);
      if (W - cR > 34) floor(cR + 10, fy, 18);
      if (W - cR > 64) floor(cR + 40, fy, 18);
    }
    if (R() < 0.6) ac(R() < 0.5 ? 2 : Math.max(2, cL - 16), fy + 40);
    if (fy < RIGHT_TOP - 140 && R() < 0.6) ac(gapC(fy) + gapHW(fy) + 6, fy + 70);
  }
  // piano terra: cancello a griglia a sinistra, siepe e recinzione a destra
  { const gl = gapC(40) - gapHW(40), r = row(110);
    rect('#c2b29a', 2, r - 4, gl - 12, 6);
    rect('#fff6c8', 8, r + 2, 24, 2);
    rect('#2b2a33', 4, r + 6, gl - 16, 104);
    w.fillStyle = '#4c4a58';
    for (let x = 4; x < gl - 12; x += 4) w.fillRect(x, r + 6, 1, 104);
    for (let y = r + 6; y < r + 110; y += 4) w.fillRect(4, y, gl - 16, 1);
    const gr = gapC(40) + gapHW(40);
    rect('#1f1f28', gr + 6, row(80), 2, 80);
    for (let i = 0; i < 70; i++) rect(R() < 0.5 ? '#3e7a3e' : '#5a9a48', gr + 8 + R()*(W - gr - 10), row(10 + R()*70), 4, 3);
  }
  // strozzature dentro la spacca (cornicioni e tubi) dove si incastra il pallone
  for (const p of game.pockets){
    const c = gapC(p.y), hw = gapHW(p.y), r = row(p.y);
    const len = Math.round(hw*2 - 2*BALL_R - 1);
    const x0 = p.side < 0 ? Math.round(c - hw) : Math.round(c + hw - len);
    if (p.pipe){
      rect('#8b9bb4', x0, r - 3, len, 6); rect('#c0cbdc', x0, r - 3, len, 1); rect('#5a6988', x0, r + 2, len, 1);
    } else {
      rect('#a8898a', x0, r - 4, len, 8); rect('#c4a6a4', x0, r - 4, len, 1); rect('#4a3638', x0, r + 4, len, 2);
    }
  }
  // sbalzo del palazzo di destra che chiude la spacca
  { const c = gapC(BRIDGE), hw = gapHW(BRIDGE), x0 = Math.round(c - hw - 6);
    rect('#9a7b78', x0, row(BRIDGE + BRIDGE_T), W - x0, BRIDGE_T);
    rect('#b0908c', x0, row(BRIDGE + BRIDGE_T), W - x0, 2);
    rect('#4a3638', x0, row(BRIDGE), W - x0, 3);
    rect('#fee761', Math.round(c) - 1, row(BRIDGE) + 3, 2, 2); }
  // tetti con le pergole rosse
  const roof = (x0, x1, ty) => {
    rect('#9a7b78', x0, row(ty), x1 - x0, 22);
    rect('#b0908c', x0, row(ty), x1 - x0, 2);
    rect('#c48a7a', x0 + 10, row(ty) + 8, 14, 5); // intonaco scrostato
    const top = row(ty) - 26;
    rect('rgba(200,225,235,0.8)', x0, top, x1 - x0, 6);
    w.fillStyle = '#c8323c';
    for (let x = x0; x < x1; x += 7) w.fillRect(x, top, 1, 6);
    w.fillRect(x0, top, x1 - x0, 1); w.fillRect(x0, top + 6, x1 - x0, 1);
    for (let x = x0 + 8; x < x1; x += 34) for (let k = 0; k < 26; k++) w.fillRect(x + (k / 4 | 0), top + k, 2, 1);
  };
  roof(0, Math.round(gapC(WALL_TOP) - gapHW(WALL_TOP)), WALL_TOP);
  roof(Math.round(gapC(RIGHT_TOP) - gapHW(RIGHT_TOP)) - 6, W, RIGHT_TOP);
  // tacche dei metri sul bordo sinistro
  for (let m = 1; m * 100 < WALL_TOP; m++) rect('#5a4040', 0, row(m * 100), m % 5 === 0 ? 6 : 3, 1);
}

// ================== TURNI ==================
let ball = null, kidAnim = 0, wind = 0, power = 0, charging = false, chargeT = 0;
let gustAmp = 0, gustF = 1, gustPh = 0, aimA = 0;
const MAX_ANGLE = 0.45; // ~26 gradi
const windNow = () => wind + gustAmp * Math.sin(game.t * gustF + gustPh);
let cam = 0, camTarget = 0, banner = null, resultT = 0, lastResult = null, tickPh = 0;

function cur(){ return game.players[game.turn]; }

function startTurn(){
  state = 'aim';
  const p = cur();
  ball = { x: p.x + 5, y: BALL_R, vx: 0, vy: 0, spin: 0, bounces: 0, ground: 0, stillT: 0, flyT: 0, inGap: false };
  aimA = 0;
  wind = (Math.random()*2 - 1) * (10 + game.round*6);
  gustAmp = 6 + game.round*4; gustF = 1.2 + Math.random()*1.5; gustPh = Math.random()*6.28;
  spawnBirds();
  power = 0; charging = false; camTarget = 0;
  const who = game.players.length > 1 ? 'TOCCA A ' + p.kid.name : 'TIRO ' + game.round + '/' + menu.rounds;
  banner = { text: who, t: 1.6, color: p.kid.shirt };
}

function kick(){
  const p = cur();
  const pw = Math.max(0.03, power);
  const h = pw * MAX_H * (1 + (Math.random()-0.5)*0.03);
  ball.vy = Math.sqrt(2*G*h);
  ball.vx = ball.vy * Math.tan(aimA) + (Math.random()-0.5)*6;
  ball.x = p.x + 5; ball.y = BALL_R + 4;
  kidAnim = 0.3;
  state = 'flight';
  sfx.kick();
  for (let i=0;i<8;i++) game.particles.push({ x: ball.x, y: 2, vx:(Math.random()-0.5)*60, vy: Math.random()*60, t:0.4, c:'#8b9bb4' });
}

function endTurn(res){
  lastResult = res; state = 'result'; resultT = 1.8;
}

function nextTurn(){
  game.turn++;
  if (game.turn >= game.players.length){ game.turn = 0; game.round++; }
  if (game.round > menu.rounds){ gameOver(); return; }
  startTurn();
}

function gameOver(){
  state = 'over'; camTarget = 0;
  if (game.players.length === 1){
    const s = score(0);
    if (s > best){ best = s; try{ localStorage.setItem('spacca_best', best); }catch(e){} }
  }
  sfx.win();
}

// ================== FISICA ==================
function update(dt){
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (kidAnim > 0) kidAnim -= dt;

  if (state === 'aim' && charging){
    chargeT += dt;
    const sweep = Math.max(0.5, 0.95 - (game.round - 1)*0.12);
    const ph = (chargeT / sweep) % 2;
    const tri = ph < 1 ? ph : 2 - ph;
    power = Math.max(0, Math.min(1, Math.pow(tri, 1.6) + 0.012*Math.sin(chargeT*31)));
    tickPh += dt; if (tickPh > 0.12){ tickPh = 0; beep(200 + power*700, 0.02, 'square', null, 0.03); }
  }

  if (state === 'flight'){
    const steps = 10, h = dt/steps;
    ball.flyT += dt;
    for (let s=0; s<steps && state==='flight'; s++){
      ball.vx += windNow() * 0.9 * h;
      hitBirds();
      ball.vy -= G * h;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      ball.spin += ball.vx * h * 0.3 + h*8;
      if (ball.x < BALL_R){ ball.x = BALL_R; ball.vx = Math.abs(ball.vx)*0.6; bounceFx(); }
      if (ball.x > W-BALL_R){ ball.x = W-BALL_R; ball.vx = -Math.abs(ball.vx)*0.6; bounceFx(); }
      // balconi e condizionatori
      for (const o of game.solids) collideRect(o);
      // pareti della spacca: una volta dentro, il pallone rimbalza tra i due muri
      if (ball.y > 25 && ball.y < BRIDGE){
        const c = gapC(ball.y), hw = gapHW(ball.y), lo = c - hw + BALL_R, hi = c + hw - BALL_R;
        if (ball.inGap){
          if (ball.x < lo){ ball.x = lo; if (ball.vx < -40) bounceFx(); ball.vx = Math.abs(ball.vx)*0.92; }
          else if (ball.x > hi){ ball.x = hi; if (ball.vx > 40) bounceFx(); ball.vx = -Math.abs(ball.vx)*0.92; }
        } else if (ball.x > lo && ball.x < hi) ball.inGap = true;
      } else if (ball.y <= 25) ball.inGap = false;
      // palloni già incastrati: ci rimbalzi, e se vai forte li butti giù
      for (const p of game.pockets){
        if (p.owner < 0) continue;
        const dx = ball.x - p.x, dy = ball.y - p.y, d2 = dx*dx + dy*dy;
        if (d2 < 4*BALL_R*BALL_R && d2 > 0.01){
          const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, sp = Math.hypot(ball.vx, ball.vy);
          if (sp > 420){
            game.falling.push({ x:p.x, y:p.y, vx: -nx*120, vy: 80, spin:0, owner:p.owner });
            popup(p.owner === game.turn ? 'OPS!' : 'COLPITO!', p.x, p.y + 10, game.players[p.owner].kid.shirt);
            p.owner = -1; sfx.knock();
            ball.vx *= 0.6; ball.vy *= 0.6;
          } else {
            ball.x = p.x + nx*2*BALL_R; ball.y = p.y + ny*2*BALL_R;
            const vn = ball.vx*nx + ball.vy*ny;
            if (vn < 0){ ball.vx -= 1.6*vn*nx; ball.vy -= 1.6*vn*ny; bounceFx(); }
          }
        }
      }
      if (ball.y > WALL_TOP + 20 && ball.vy > 0){ ball.vy *= 0.3; } // tetto
      // dentro la spacca: lo sbalzo in alto fa rimbalzare giù
      const dentro = inGap(ball.x, Math.min(ball.y, BRIDGE - 1));
      if (dentro && ball.y > BRIDGE - BALL_R && ball.y < BRIDGE + 10 && ball.vy > 0){
        ball.y = BRIDGE - BALL_R; ball.vy = -ball.vy * 0.25; sfx.bounce();
        game.particles.push({ x: ball.x, y: BRIDGE, vx: 0, vy: -20, t: 0.5, c: '#9a7b78' });
      }
      // incastro nelle strozzature
      if (dentro && Math.abs(ball.vy) < CATCH_VY){
        for (const p of game.pockets){
          if (Math.abs(ball.y - p.y) < CATCH_DY){
            if (Math.abs(ball.x - p.x) < CATCH_DX && Math.abs(ball.vx) < CATCH_VX){ lodge(p); break; }
            // lato sbagliato: sbatte sul cornicione e ricade
            const c = gapC(p.y);
            if (Math.sign(ball.x - c) !== Math.sign(p.x - c) && ball.vy > 0 && !ball.hitLedge){
              ball.hitLedge = true; ball.vy = -ball.vy*0.3; ball.vx += (p.x - ball.x)*2; sfx.bounce(); break;
            }
          }
        }
      }
      if (state==='flight' && ball.y <= BALL_R && ball.vy < 0){
        ball.y = BALL_R;
        if (ball.vy < -220 && ball.ground < 2){ // rimbalzo sul marciapiede
          ball.ground++; ball.vy = -ball.vy*0.42; ball.vx *= 0.7; sfx.bounce();
          popup('BOING', ball.x, 14, '#f4f4f4');
        } else { sfx.miss(); endTurn({ ok:false }); }
      }
      // fermo su un balcone?
      if (state==='flight'){
        if (Math.hypot(ball.vx, ball.vy) < 30 && ball.y > 20) ball.stillT += h; else ball.stillT = 0;
        if (ball.stillT > 0.7){ sfx.miss(); endTurn({ ok:false, balcony:true }); }
        else if (ball.flyT > 12){ sfx.miss(); endTurn({ ok:false }); }
      }
    }
    camTarget = Math.max(0, Math.min(WALL_TOP - H*0.5, ball.y - H*0.45));
  }

  if (state === 'result'){
    resultT -= dt;
    if (resultT <= 0.6) camTarget = 0;
    if (resultT <= 0) nextTurn();
  }

  // camera morbida
  cam += (camTarget - cam) * Math.min(1, dt * (state==='flight' ? 10 : 4));

  // palloni buttati giù
  for (const f of game.falling){ f.vy -= G*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.spin += dt*10; }
  game.falling = game.falling.filter(f => f.y > -20);
  game.t += dt;
  for (const b of game.birds){
    if (b.scared > 0){ b.scared -= dt; b.y += 160*dt; b.x += b.vx*2.5*dt; }
    else { b.x += b.vx*dt; b.y += Math.sin(game.t*2 + b.ph)*8*dt; }
    if (b.x < -10) b.x = W + 10; if (b.x > W + 10) b.x = -10;
  }
  for (const u of game.popups){ u.t -= dt; u.y += 25*dt; }
  game.popups = game.popups.filter(u => u.t > 0);
  for (const q of game.particles){ q.t -= dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy -= 300*dt; }
  game.particles = game.particles.filter(q => q.t > 0);
}

function popup(text, x, y, color){ game.popups.push({ text, x, y, color, t: 1.1 }); }
function bounceFx(){
  ball.bounces++;
  sfx.bounce();
  for (let i=0;i<3;i++) game.particles.push({ x: ball.x, y: ball.y, vx:(Math.random()-0.5)*50, vy:(Math.random()-0.5)*50, t:0.3, c:'#f4f4f4' });
}
function collideRect(o){
  const cx = Math.max(o.x0, Math.min(o.x1, ball.x)), cy = Math.max(o.y0, Math.min(o.y1, ball.y));
  const dx = ball.x - cx, dy = ball.y - cy, d2 = dx*dx + dy*dy;
  if (d2 >= BALL_R*BALL_R) return;
  let nx, ny, d;
  if (d2 < 1e-6){ // centro dentro l'ostacolo: esci dal lato più vicino
    const l = ball.x - o.x0, r = o.x1 - ball.x, b = ball.y - o.y0, t = o.y1 - ball.y, m = Math.min(l, r, b, t);
    if (m === l){ nx = -1; ny = 0; d = -l; } else if (m === r){ nx = 1; ny = 0; d = -r; }
    else if (m === b){ nx = 0; ny = -1; d = -b; } else { nx = 0; ny = 1; d = -t; }
  } else { d = Math.sqrt(d2); nx = dx/d; ny = dy/d; }
  ball.x += nx*(BALL_R - d); ball.y += ny*(BALL_R - d);
  const vn = ball.vx*nx + ball.vy*ny;
  if (vn < 0){
    const e = o.kind === 'clima' ? 0.75 : 0.5;
    ball.vx -= (1+e)*vn*nx; ball.vy -= (1+e)*vn*ny;
    ball.vx *= 0.95;
    if (-vn > 70){
      bounceFx();
      if (-vn > 250) popup(o.kind === 'clima' ? 'CLANG!' : 'BOING!', ball.x, ball.y + 8, '#fee761');
    }
  }
}

function spawnBirds(){
  game.birds = [];
  const n = Math.min(5, game.round + 1);
  for (let i=0;i<n;i++){
    const sp = 22 + Math.random()*30 + game.round*6;
    game.birds.push({ x: Math.random()*W, y: 250 + Math.random()*(BRIDGE - 350), vx: Math.random()<0.5 ? sp : -sp, ph: Math.random()*6, scared: 0 });
  }
}
function hitBirds(){
  for (const b of game.birds){
    if (b.scared > 0) continue;
    const dx = ball.x - b.x, dy = ball.y - b.y;
    if (dx*dx + dy*dy < 36){
      b.scared = 3;
      ball.vx += (dx >= 0 ? 1 : -1) * (50 + Math.random()*50);
      ball.vy *= 0.55;
      beep(1200, 0.08, 'square', 600, 0.08); setTimeout(()=>beep(1400,0.06,'square',700,0.06), 70);
      for (let i=0;i<6;i++) game.particles.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*60, vy:Math.random()*40, t:0.8, c:'#c0cbdc' });
    }
  }
}

function lodge(p){
  const me = game.turn;
  let knocked = null;
  if (p.owner >= 0){
    knocked = p.owner;
    game.falling.push({ x:p.x, y:p.y, vx:(Math.random()-0.5)*80, vy:120, spin:0, owner:p.owner });
    sfx.knock();
  }
  p.owner = me;
  ball.vx = ball.vy = 0; ball.x = p.x; ball.y = p.y;
  for (let i=0;i<14;i++) game.particles.push({ x:p.x, y:p.y, vx:(Math.random()-0.5)*120, vy:(Math.random()-0.2)*120, t:0.6, c: i%2 ? '#efc08a' : cur().kid.shirt });
  sfx.stuck();
  endTurn({ ok:true, h:p.y, knocked, bank: ball.bounces });
}

const sy = wy => H - GROUND - (wy - cam); // altezza mondo -> y schermo

function text(s, x, y, size=8, color='#f4f4f4', align='center', shadow=true){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow){ ctx.fillStyle = '#1a1c2c'; ctx.fillText(s, x+1, y+1); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawBall(x, y, spin=0, owner=-1){
  const X = Math.round(x), Y = Math.round(y);
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(X-3, Y-4, 7, 9); ctx.fillRect(X-4, Y-3, 9, 7);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(X-2, Y-3, 5, 7); ctx.fillRect(X-3, Y-2, 7, 5);
  ctx.fillStyle = '#1a1c2c';
  const a = ((Math.floor(spin) % 4) + 4) % 4;
  const spots = [[0,0],[-2,-2],[2,1],[-1,2]];
  const s = spots[a], s2 = spots[(a+2)%4];
  ctx.fillRect(X+s[0], Y+s[1], 1, 1); ctx.fillRect(X+s2[0], Y+s2[1], 1, 1);
  if (owner >= 0){ ctx.fillStyle = game.players[owner].kid.shirt; ctx.fillRect(X-1, Y-1, 3, 2); }
}

function drawKid(x, kid, active, kicking){
  const X = Math.round(x), base = Math.round(sy(0));
  // ombra
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(X-5, base, 12, 2);
  // gambe
  ctx.fillStyle = kid.skin;
  ctx.fillRect(X-3, base-6, 2, 6);
  if (kicking){ ctx.fillRect(X+1, base-7, 2, 3); ctx.fillRect(X+3, base-9, 3, 2); }
  else ctx.fillRect(X+1, base-6, 2, 6);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(X-4, base-1, 3, 1); // scarpe
  if (kicking) ctx.fillRect(X+6, base-10, 2, 2); else ctx.fillRect(X+1, base-1, 3, 1);
  // pantaloncini
  ctx.fillStyle = kid.shorts; ctx.fillRect(X-3, base-9, 6, 3);
  // maglia
  ctx.fillStyle = kid.shirt; ctx.fillRect(X-4, base-15, 8, 7);
  ctx.fillRect(X-5, base-14, 1, 4); ctx.fillRect(X+4, base-14, 1, 4);
  // braccia
  ctx.fillStyle = kid.skin;
  if (kicking){ ctx.fillRect(X-7, base-16, 2, 2); ctx.fillRect(X+5, base-15, 2, 2); }
  else { ctx.fillRect(X-5, base-10, 1, 2); ctx.fillRect(X+4, base-10, 1, 2); }
  // testa
  ctx.fillStyle = kid.skin; ctx.fillRect(X-3, base-21, 6, 6);
  ctx.fillStyle = kid.hair; ctx.fillRect(X-3, base-22, 6, 2); ctx.fillRect(X-4, base-21, 1, 3);
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(X+1, base-19, 1, 1); ctx.fillRect(X-1, base-19, 1, 1);

    ctx.fillStyle = kid.shirt;
    ctx.fillRect(X-2, base-30+b, 5, 1); ctx.fillRect(X-1, base-29+b, 3, 1); ctx.fillRect(X, base-28+b, 1, 1);

function drawPowerBar(){

  text(meters(power*MAX_H), bx-2, by-12, 6, c, 'left');
}

function draw(){
  ctx.fillStyle = '#41a6f6'; ctx.fillRect(0,0,W,H);
  if (state === 'menu'){ drawMenu(); return; }

  // muro
  const topWy = cam + (H - GROUND);
  const srcY = (WALL_TOP + 40) - topWy;
  ctx.drawImage(wallCv, 0, Math.round(srcY), W, H, 0, 0, W, H);
  drawStreet();

  // palloni incastrati
  for (const p of game.pockets) if (p.owner >= 0 && !(state==='result' && lastResult.ok && lastResult.h===p.y && resultT>1.5)){
    drawBall(p.x, sy(p.y), 0, p.owner);
  }
  // linea di mira
  if (state === 'aim'){
    const x0 = cur().x + 5, y0 = sy(BALL_R + 2), dx = Math.sin(aimA), dy = Math.cos(aimA);
    ctx.fillStyle = 'rgba(244,244,244,0.7)';
    for (let k = 10; k < 70; k += 6) ctx.fillRect(Math.round(x0 + dx*k), Math.round(y0 - dy*k), 2, 2);
    ctx.fillStyle = '#fee761';
    ctx.fillRect(Math.round(x0 + dx*74) - 1, Math.round(y0 - dy*74) - 1, 3, 3);
  }
  // bambini
  game.players.forEach((p, i) => {
    if (i !== game.turn) drawKid(p.x, p.kid, false, false);
  });
  drawKid(cur().x, cur().kid, state==='aim', kidAnim > 0);
  // pallone
  for (const f of game.falling) drawBall(f.x, sy(f.y), f.spin, f.owner);
  if (state === 'aim' || state === 'flight' || (state === 'result' && !lastResult.ok)) drawBall(ball.x, sy(ball.y), ball.spin);
  if (state === 'result' && lastResult.ok && resultT > 1.5) drawBall(ball.x, sy(ball.y), ball.spin, game.turn);
  // piccioni
  for (const b of game.birds){
    const X = Math.round(b.x), Y = Math.round(sy(b.y));
    if (Y < -5 || Y > H) continue;
    const f = Math.sin(game.t*(b.scared>0?40:14) + b.ph) > 0;
    const d = b.vx > 0 ? 1 : -1;
    ctx.fillStyle = '#5a6988'; ctx.fillRect(X-3, Y-1, 6, 3);
    ctx.fillStyle = '#8b9bb4'; ctx.fillRect(X-2, f ? Y-4 : Y+1, 4, f ? 3 : 2);
    ctx.fillStyle = '#5a6988'; ctx.fillRect(X + d*3 - (d<0?1:0), Y-2, 2, 2);
    ctx.fillStyle = '#feae34'; ctx.fillRect(X + d*5 - (d<0?1:0), Y-1, 1, 1);
  }
  // scritte volanti
  for (const u of game.popups) text(u.text, u.x, Math.round(sy(u.y)), 6, u.color);
  // particelle
  for (const q of game.particles){ ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x), Math.round(sy(q.y)), 2, 2); }
  // altezza durante il volo
  if (state === 'flight') text(meters(Math.max(0, ball.y)), W/2, 44, 8, '#fee761');

  drawHUD();
  if (state === 'aim') drawPowerBar();
  if (state === 'aim' && !charging && !banner){
    const b = Math.sin(performance.now()/250) > 0;
    if (b) text('TIENI PREMUTO', W/2, H-GROUND+12, 6, '#fee761');
    text('e trascina: angolo', W/2, H-GROUND+21, 6, '#c0cbdc', 'center');
    text('trascina il bimbo: sposta', W/2, H-GROUND+30, 6, '#c0cbdc', 'center');
  }
  if (state === 'result'){
    const r = lastResult;
    if (r.ok){
      text('INCASTRATO!', W/2, 100, 10, '#fee761');
      text(meters(r.h), W/2, 116, 16, cur().kid.shirt);
      if (r.bank > 0) text(r.bank > 2 ? 'SUPER SPONDA x' + r.bank + '!' : 'DI SPONDA!', W/2, 160, 8, '#73eff7');
      if (r.knocked !== null && r.knocked !== undefined){
        text(r.knocked === game.turn ? 'TI SEI BUTTATO GIU!' : 'HAI BUTTATO GIU', W/2, 140, 6, '#f4f4f4');
        if (r.knocked !== game.turn) text(game.players[r.knocked].kid.name + '!', W/2, 150, 8, game.players[r.knocked].kid.shirt);
      }
    } else {
      if (r.balcony){
        text('SUL BALCONE!', W/2, 110, 10, '#e43b44');
        text('addio pallone...', W/2, 126, 6, '#f4f4f4');
      } else {
        text('NIENTE!', W/2, 110, 12, '#e43b44');
        text('ritenta', W/2, 128, 6, '#f4f4f4');
      }
    }
  }
  if (banner){
    ctx.fillStyle = 'rgba(26,28,44,0.85)'; ctx.fillRect(0, 140, W, 28);
    ctx.fillStyle = banner.color; ctx.fillRect(0, 140, W, 2); ctx.fillRect(0, 166, W, 2);
    text(banner.text, W/2, 150, 8, banner.color);
  }
  if (state === 'over') drawOver();
}

// ================== INPUT ==================
let ptr = null;
function toGame(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toGame(e);
  if (state === 'menu' || state === 'over'){
    for (const b of buttons) if (p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ b.onTap(); return; }
    return;
  }
  if (state === 'aim'){
    if (banner) banner = null;
    const kx = cur().x, ky = sy(0);
    const onKid = Math.abs(p.x - kx) < 14 && p.y > ky - 32 && p.y < ky + 12;
    ptr = { id: e.pointerId, x: p.x, move: onKid };
    if (!onKid){ charging = true; chargeT = 0; power = 0; }
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || state !== 'aim') return;
  const p = toGame(e);
  const pl = cur();
  if (ptr.move){
    pl.x = Math.max(8, Math.min(W - 14, pl.x + (p.x - ptr.x)));
    ball.x = pl.x + 5;
  } else {
    aimA = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, aimA + (p.x - ptr.x)*0.012));
  }
  ptr.x = p.x;
});
function release(e){
  if (!ptr || e.pointerId !== ptr.id) return;
  ptr = null;
  if (state === 'aim' && charging){ charging = false; kick(); }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => { // tastiera per PC
  if (state !== 'aim') return;
  if (e.code === 'ArrowLeft'){ cur().x = Math.max(8, cur().x - 3); ball.x = cur().x + 5; }
  if (e.code === 'ArrowRight'){ cur().x = Math.min(W-14, cur().x + 3); ball.x = cur().x + 5; }
  if (e.code === 'KeyA') aimA = Math.max(-MAX_ANGLE, aimA - 0.04);
  if (e.code === 'KeyD') aimA = Math.min(MAX_ANGLE, aimA + 0.04);
  if (e.code === 'Space' && !charging){ audio(); banner = null; charging = true; chargeT = 0; }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && state === 'aim' && charging){ charging = false; kick(); } });

// ================== LOOP ==================
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state !== 'menu') update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
