<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1c2c">
<title>Pallone nella Spacca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#1a1c2c;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ================== SETUP ==================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const H = 320;           // risoluzione logica verticale (pixel art)
let W = 180;
const GROUND = 40;       // altezza in pixel della strada sotto lo schermo
const WALL_TOP = 2100;   // altezza del muro (unità; 100 = 1 metro)
const MAX_H = 2400;      // altezza massima del tiro (i rimbalzi poi tolgono forza)
const BRIDGE = 1700;     // sbalzo del palazzo di destra che chiude la spacca
const BRIDGE_T = 70;
const RIGHT_TOP = 1960;  // tetto del palazzo di destra
const G = 800;           // gravità
const BALL_R = 3.5;
const FONT = '"Press Start 2P", monospace';

function resize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  W = Math.round(Math.max(160, Math.min(240, H * vw / vh)));
  cv.width = W; cv.height = H;
  const s = Math.min(vw / W, vh / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  ctx.imageSmoothingEnabled = false;
  if (game) buildWall();
}

// ================== AUDIO ==================
let ac = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
function beep(f, d=0.1, type='square', f2=null, vol=0.08){
  if(!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
}
const sfx = {
  kick(){ beep(140,0.12,'square',60,0.15); },
  stuck(){ beep(523,0.08); setTimeout(()=>beep(659,0.08),80); setTimeout(()=>beep(784,0.16),160); },
  miss(){ beep(300,0.35,'sawtooth',80,0.08); },
  knock(){ beep(900,0.06,'square',200,0.1); },
  bounce(){ beep(220,0.04,'triangle',null,0.06); },
  tick(){ beep(880,0.03,'square',null,0.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18),i*140)); }
};

// ================== DATI ==================
// shirt = colore del giocatore nell'interfaccia; top/top2 = colori veri della maglia
const KIDS = [
  { name:'UCA',    shirt:'#f4f4f4', mark:'#3b5dc9', top:'#f4f4f4', top2:'#d4af37', kit:'trim',
    shorts:'#f4f4f4', hair:'#6b4428', hairStyle:'short', beard:'#8a5a38', beardType:'stubble', skin:'#f2c6a0' },
  { name:'FABIO',  shirt:'#9aa4b8', mark:'#1a1c2c', top:'#f4f4f4', top2:'#1a1c2c', kit:'stripes',
    shorts:'#1a1c2c', hair:'#2a1a14', hairStyle:'long', beard:'#2a1a14', beardType:'full', skin:'#e0ac85' },
  { name:'TANO',   shirt:'#e43b44', mark:'#e43b44', top:'#d8323c', top2:'#fee761', kit:'collar',
    shorts:'#b0222c', bald:true, beard:'#3a2418', beardType:'full', skin:'#d8a07a' },
  { name:'GIAMMY', shirt:'#0099db', mark:'#0099db', top:'#1f6fd0', top2:'#f4f4f4', kit:'italia',
    shorts:'#f4f4f4', hair:'#2a1a14', hairStyle:'quiff', skin:'#eab48e' },
  { name:'PASO',   shirt:'#feae34', mark:'#feae34', top:'#1a1c2c', top2:'#feae34', kit:'shoulders',
    shorts:'#1a1c2c', hair:'#2a1a14', hairStyle:'short', beard:'#3a2a20', beardType:'stubble', skin:'#dba57c' },
];

let game = null;     // stato della partita
let state = 'menu';  // menu | select | aim | flight | result | over | board
let menu = { players:5, rounds:3 };
let best = 0;
try { best = +localStorage.getItem('spacca_best') || 0; } catch(e){}

// la spacca tra i due palazzi: muri dritti e lisci, chiusa in alto dallo sbalzo
function gapC(y){ return W/2; }
function gapHW(y){ return 16 * (game && game.gapScale || 1); }
// l'unico punto dove il pallone si incastra: in alto a sinistra, sotto lo sbalzo
function nicheX(){ return gapC(BRIDGE) - gapHW(BRIDGE) + BALL_R; }
const NICHE_Y = BRIDGE - BALL_R;
function nicheTol(){ return isClimb() ? Math.max(3.5, 6.5 - (game.level - 1)*0.2) : 6; }
// dove può stare il figghiuleddu nel vialetto (dentro la spacca)
function kidMin(){ return gapC(0) - gapHW(0) + 5; }
function kidMax(){ return gapC(0) + gapHW(0) - 6; }

function makeGame(mode){
  online.saved = false; online.msg = null;
  dist = {}; shakeT = 0; kidJump = 0;
  game = {
    mode, players: [], round: 1, turn: 0, gapScale: 1, chargeBoost: 0, lockX: null,
    niche: { owner: -1 }, points: [], closest: [],
    falling: [], particles: [], birds: [], popups: [], solids: [], t: 0,
  };
}
function newGame(){
  makeGame('party');
  // chi aspetta sta sul marciapiede, ai lati della spacca
  const homes = [W*0.3, W*0.72, W*0.21, W*0.84, W*0.95];
  for (let i=0;i<menu.players;i++){
    game.players.push({ kid:KIDS[i], home: homes[i], x: homes[i], gx: gapC(0) + 4 });
    game.points.push(0); game.closest.push(Infinity);
  }
  buildWall();
  startTurn();
}

function score(i){ return game.points[i] || 0; }
const cm = d => Math.max(1, Math.round(d)) + ' cm';
const meters = y => (y/100).toFixed(1) + 'm';

// ================== PALAZZI E SPACCA (pre-renderizzati) ==================
let wallCv = null;
const WALL_IMG_H = WALL_TOP + 60;
function rnd(seed){ let s = seed; return () => (s = (s*16807) % 2147483647) / 2147483647; }
function buildWall(){
  game.solids = [];
  wallCv = document.createElement('canvas');
  wallCv.width = W; wallCv.height = WALL_IMG_H;
  const w = wallCv.getContext('2d');
  const R = rnd(4242);
  const row = wy => WALL_TOP + 40 - wy;
  const rect = (c, x, y, ww, hh) => { w.fillStyle = c; w.fillRect(Math.round(x), Math.round(y), ww, hh); };
  // cielo
  rect('#7fb2e0', 0, 0, W, WALL_IMG_H);
  rect('#9cc6ea', 0, row(RIGHT_TOP) - 60, W, 60);
  // facciate e fessura, riga per riga
  for (let y = 0; y < WALL_TOP; y++){
    const c = gapC(y), hw = gapHW(y), gl = Math.round(c - hw), gr = Math.round(c + hw), r = row(y);
    rect('#8c6d6a', 0, r, gl, 1);                                  // palazzo sinistro
    rect('#77595a', gl - 4, r, 4, 1);                               // spigolo in ombra
    if (y < RIGHT_TOP){ rect('#8c6d6a', gr, r, W - gr, 1); rect('#6e5254', gr, r, 3, 1); }
    // dentro la spacca
    if (y < BRIDGE){
      let col = '#2a2130';
      if (y < 520) col = y < 70 ? '#3a2e34' : '#253b2c';
      rect(col, gl, r, gr - gl, 1);
    } else if (y < RIGHT_TOP) rect('#6e5254', gl, r, gr - gl, 1);
  }
  // alberi in fondo alla spacca, scale e lampioni
  for (let i = 0; i < 160; i++){
    const y = 70 + R()*450, c = gapC(y), hw = gapHW(y);
    rect(R() < 0.5 ? '#2f5a35' : '#3e7a3e', c - hw + R()*(hw*2 - 3), row(y), 3, 2);
  }
  for (let y = 4; y < 70; y += 6){ const c = gapC(y), hw = gapHW(y); rect('#5b4a48', c - hw, row(y), hw*2, 2); }
  for (const ly of [95, 150]){
    const c = gapC(ly), hw = gapHW(ly);
    rect('#3a2e34', c - hw, row(ly) + 1, 3, 1);
    rect('#fff6c8', c - hw + 2, row(ly) - 2, 4, 4);
    rect('rgba(255,240,180,0.25)', c - hw + 1, row(ly) - 4, 7, 8);
  }
  // piani: finestre, balconi rossi, condizionatori
  const floor = (x, fy, wid) => {
    const r = row(fy);
    game.solids.push({ x0: x - 3, x1: x + wid + 3, y0: fy - 4, y1: fy + 9, kind: 'balcone' });
    rect('#5a3a30', x - 1, r - 23, wid + 2, 24);
    rect('#3b3040', x, r - 22, wid, 22);
    rect('#a8652e', x, r - 22, wid, 8);
    for (let k = 0; k < 8; k += 2) rect('#8a4f24', x, r - 22 + k, wid, 1);
    // balcone
    rect('#d8d0c8', x - 3, r, wid + 6, 3);
    rect('#a89c94', x - 3, r + 3, wid + 6, 1);
    rect('#d8343f', x - 3, r - 9, wid + 6, 1);
    for (let k = 0; k <= wid + 6; k += 3) rect('#d8343f', x - 3 + k, r - 9, 1, 9);
    rect('rgba(216,52,63,0.35)', x - 3, r - 8, wid + 6, 8);
  };
  const ac = (x, y) => { const r = row(y); game.solids.push({ x0: x, x1: x + 10, y0: y - 7, y1: y, kind: 'clima' }); rect('#e8e8e8', x, r, 10, 7); rect('#9aa0a8', x + 2, r + 1, 5, 5); rect('#e8e8e8', x + 4, r + 3, 1, 1); };
  for (let fy = 300; fy < WALL_TOP - 120; fy += 260){
    const cL = gapC(fy) - gapHW(fy);
    if (cL > 40) floor(6, fy, 20);
    if (cL > 70) floor(cL - 34, fy, 18);
    if (fy < RIGHT_TOP - 140){
      const cR = gapC(fy) + gapHW(fy);
      if (W - cR > 34) floor(cR + 10, fy, 18);
      if (W - cR > 64) floor(cR + 40, fy, 18);
    }
    if (R() < 0.6) ac(R() < 0.5 ? 2 : Math.max(2, cL - 16), fy + 40);
    if (fy < RIGHT_TOP - 140 && R() < 0.6) ac(gapC(fy) + gapHW(fy) + 6, fy + 70);
  }
  // piano terra: cancello a griglia a sinistra, siepe e recinzione a destra
  { const gl = gapC(40) - gapHW(40), r = row(110);
    rect('#c2b29a', 2, r - 4, gl - 12, 6);
    rect('#fff6c8', 8, r + 2, 24, 2);
    rect('#2b2a33', 4, r + 6, gl - 16, 104);
    w.fillStyle = '#4c4a58';
    for (let x = 4; x < gl - 12; x += 4) w.fillRect(x, r + 6, 1, 104);
    for (let y = r + 6; y < r + 110; y += 4) w.fillRect(4, y, gl - 16, 1);
    const gr = gapC(40) + gapHW(40);
    rect('#1f1f28', gr + 6, row(80), 2, 80);
    for (let i = 0; i < 70; i++) rect(R() < 0.5 ? '#3e7a3e' : '#5a9a48', gr + 8 + R()*(W - gr - 10), row(10 + R()*70), 4, 3);
  }
  // l'incastro: l'angolo in alto a sinistra, sotto lo sbalzo
  { const x0 = Math.round(gapC(BRIDGE) - gapHW(BRIDGE)), r = row(BRIDGE);
    rect('#1c0f0a', x0 - 3, r, 3, 9); rect('#1c0f0a', x0, r, 5, 2);
    rect('#4a3638', x0 - 3, r + 9, 3, 1); }
  // sbalzo del palazzo di destra che chiude la spacca
  { const c = gapC(BRIDGE), hw = gapHW(BRIDGE), x0 = Math.round(c - hw - 6);
    rect('#9a7b78', x0, row(BRIDGE + BRIDGE_T), W - x0, BRIDGE_T);
    rect('#b0908c', x0, row(BRIDGE + BRIDGE_T), W - x0, 2);
    rect('#4a3638', x0, row(BRIDGE), W - x0, 3);
    rect('#fee761', Math.round(c) - 1, row(BRIDGE) + 3, 2, 2); }
  // tetti con le pergole rosse
  const roof = (x0, x1, ty) => {
    rect('#9a7b78', x0, row(ty), x1 - x0, 22);
    rect('#b0908c', x0, row(ty), x1 - x0, 2);
    rect('#c48a7a', x0 + 10, row(ty) + 8, 14, 5); // intonaco scrostato
    const top = row(ty) - 26;
    rect('rgba(200,225,235,0.8)', x0, top, x1 - x0, 6);
    w.fillStyle = '#c8323c';
    for (let x = x0; x < x1; x += 7) w.fillRect(x, top, 1, 6);
    w.fillRect(x0, top, x1 - x0, 1); w.fillRect(x0, top + 6, x1 - x0, 1);
    for (let x = x0 + 8; x < x1; x += 34) for (let k = 0; k < 26; k++) w.fillRect(x + (k / 4 | 0), top + k, 2, 1);
  };
  roof(0, Math.round(gapC(WALL_TOP) - gapHW(WALL_TOP)), WALL_TOP);
  roof(Math.round(gapC(RIGHT_TOP) - gapHW(RIGHT_TOP)) - 6, W, RIGHT_TOP);
  // tacche dei metri sul bordo sinistro
  for (let m = 1; m * 100 < WALL_TOP; m++) rect('#5a4040', 0, row(m * 100), m % 5 === 0 ? 6 : 3, 1);
}

// ================== TURNI ==================
let ball = null, kidAnim = 0, wind = 0, power = 0, charging = false, chargeT = 0;
let gustAmp = 0, gustF = 1, gustPh = 0, aimA = 0;
const MAX_ANGLE = 0.45; // ~26 gradi
function sweepTime(){
  let sw = isClimb() ? Math.max(0.45, 1.15 - (game.level - 1)*0.05) : Math.max(0.5, 0.95 - (game.round - 1)*0.12);
  if (perk('GIAMMY')) sw *= 1.35;
  return sw;
}
const windNow = () => wind + gustAmp * Math.sin(game.t * gustF + gustPh);
let cam = 0, camTarget = 0, banner = null, resultT = 0, lastResult = null, tickPh = 0;

function cur(){ return game.players[game.turn]; }

function startTurn(){
  state = 'aim';
  const p = cur();
  p.x = game.lockX !== null ? game.lockX : Math.max(kidMin(), Math.min(kidMax(), p.gx));
  ball = { x: ballStartX(), y: BALL_R, vx: 0, vy: 0, spin: 0, bounces: 0, ground: 0, stillT: 0, flyT: 0, minD: Infinity, knocked: -1 };
  aimA = 0;
  wind = (Math.random()*2 - 1) * (10 + game.round*6);
  gustAmp = 6 + game.round*4; gustF = 1.2 + Math.random()*1.5; gustPh = Math.random()*6.28;
  power = 0; charging = false; camTarget = 0;
  const who = game.players.length > 1 ? 'TOCCA A ' + p.kid.name : 'TIRO ' + game.round + '/' + menu.rounds;
  banner = { text: who, t: 1.6, color: p.kid.shirt, kid: p.kid };
  if (isClimb()) climbTurnSetup();
  spawnBirds();
}

function ballStartX(){
  const c = gapC(0), hw = gapHW(0);
  return Math.max(c - hw + BALL_R, Math.min(c + hw - BALL_R, cur().x + 4));
}
function kick(){
  const p = cur();
  p.gx = p.x;
  const pw = Math.max(0.03, power);
  const h = pw * MAX_H * (1 + (Math.random()-0.5)*(perk('TANO') ? 0.1 : 0.03));
  ball.vy = Math.sqrt(2*G*h);
  ball.vx = ball.vy * Math.tan(aimA) + (Math.random()-0.5)*6;
  ball.x = ballStartX(); ball.y = BALL_R + 4;
  kidAnim = 0.3;
  state = 'flight';
  sfx.kick();
  for (let i=0;i<8;i++) game.particles.push({ x: ball.x, y: 2, vx:(Math.random()-0.5)*60, vy: Math.random()*60, t:0.4, c:'#8b9bb4' });
}

function endTurn(res){
  lastResult = res; state = 'result'; resultT = 1.9;
  if (!res.ok && !isClimb()) game.closest[game.turn] = Math.min(game.closest[game.turn], res.d);
}
function missRes(){ return { ok: false, d: ball.minD, knocked: ball.knocked }; }

function nextTurn(){
  if (isClimb()){ climbNext(); return; }
  cur().x = cur().home;
  game.turn++;
  if (game.turn >= game.players.length){ game.turn = 0; game.round++; }
  if (game.round > menu.rounds){ gameOver(); return; }
  startTurn();
}

function gameOver(){
  state = 'over'; camTarget = 0;
  if (game.players.length === 1){
    const s = score(0);
    if (s > best){ best = s; try{ localStorage.setItem('spacca_best', best); }catch(e){} }
  }
  sfx.win();
}

// ================== FISICA ==================
function update(dt){
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; }
  if (kidAnim > 0) kidAnim -= dt;

  if (shakeT > 0){ shakeT -= dt; if (shakeT <= 0) shakeA = 0; }
  if (kidJump > 0) kidJump -= dt;
  if (game.chargeBoost > 0) game.chargeBoost -= dt;
  updateDisturbs(dt);
  if (state === 'aim' && charging){
    chargeT += dt * (game.chargeBoost > 0 ? 2.2 : 1);
    const sweep = sweepTime();
    const ph = (((chargeT / sweep) % 2) + 2) % 2;
    const tri = ph < 1 ? ph : 2 - ph;
    const jit = perk('TANO') ? 0.04 : 0.012;
    power = Math.max(0, Math.min(1, Math.pow(tri, 1.6) + jit*Math.sin(chargeT*31)));
    tickPh += dt; if (tickPh > 0.12){ tickPh = 0; beep(200 + power*700, 0.02, 'square', null, 0.03); }
  }

  if (state === 'flight'){
    const steps = 10, h = dt/steps;
    ball.flyT += dt;
    for (let s=0; s<steps && state==='flight'; s++){
      ball.vx += windNow() * 0.9 * h;
      hitBirds();
      ball.vy -= G * h;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      ball.spin += ball.vx * h * 0.3 + h*8;
      // muri della spacca: ogni rimbalzo toglie forza
      const c = gapC(ball.y), hw = gapHW(ball.y), lo = c - hw + BALL_R, hi = c + hw - BALL_R;
      if (ball.x < lo){ ball.x = lo; wallBounce(1); }
      else if (ball.x > hi){ ball.x = hi; wallBounce(-1); }
      // c'è un pallone incastrato lassù? se lo prendi lo butti giù
      const n = game.niche;
      if (n.owner >= 0){
        const dx = ball.x - nicheX(), dy = ball.y - NICHE_Y;
        if (dx*dx + dy*dy < 4*BALL_R*BALL_R) knockNiche();
      }
      // lo sbalzo: nell'angolo a sinistra si incastra (anche se arriva forte), altrove rimbalza giù
      if (ball.y >= BRIDGE - BALL_R && ball.vy > 0){
        if (n.owner < 0 && ball.x <= lo + nicheTol()){ wedge(); break; }
        ball.y = BRIDGE - BALL_R; ball.vy = -ball.vy*0.3; ball.vx *= 0.7; sfx.bounce();
        game.particles.push({ x: ball.x, y: BRIDGE, vx: 0, vy: -20, t: 0.5, c: '#9a7b78' });
      }
      ball.minD = Math.min(ball.minD, Math.hypot(ball.x - nicheX(), NICHE_Y - ball.y));
      if (state==='flight' && ball.y <= BALL_R && ball.vy < 0){
        ball.y = BALL_R;
        if (ball.vy < -220 && ball.ground < 2){ // rimbalzo sul marciapiede
          ball.ground++; ball.vy = -ball.vy*0.42; ball.vx *= 0.7; sfx.bounce();
          popup('BOING', ball.x, 14, '#f4f4f4');
        } else { sfx.miss(); endTurn(missRes()); }
      }
      // fermo su un balcone?
      if (state==='flight'){
        if (ball.flyT > 12){ sfx.miss(); endTurn(missRes()); }
      }
    }
    camTarget = Math.max(0, Math.min(WALL_TOP - H*0.5, ball.y - H*0.45));
  }

  if (state === 'result'){
    resultT -= dt;
    if (resultT <= 0.6) camTarget = 0;
    if (resultT <= 0) nextTurn();
  }

  // camera morbida
  cam += (camTarget - cam) * Math.min(1, dt * (state==='flight' ? 10 : 4));

  // palloni buttati giù
  for (const f of game.falling){ f.vy -= G*dt; f.x += f.vx*dt; f.y += f.vy*dt; f.spin += dt*10; }
  game.falling = game.falling.filter(f => f.y > -20);
  game.t += dt;
  for (const b of game.birds){
    if (b.scared > 0){ b.scared -= dt; b.y += 160*dt; b.x += b.vx*2.5*dt; }
    else { b.x += b.vx*dt; b.y += Math.sin(game.t*2 + b.ph)*8*dt; }
    if (b.x < -10) b.x = W + 10; if (b.x > W + 10) b.x = -10;
  }
  for (const u of game.popups){ u.t -= dt; u.y += 25*dt; }
  game.popups = game.popups.filter(u => u.t > 0);
  for (const q of game.particles){ q.t -= dt; q.x += q.vx*dt; q.y += q.vy*dt; q.vy -= 300*dt; }
  game.particles = game.particles.filter(q => q.t > 0);
}

function popup(text, x, y, color){ game.popups.push({ text, x, y, color, t: 1.1 }); }
function bounceFx(){
  ball.bounces++;
  sfx.bounce();
  for (let i=0;i<3;i++) game.particles.push({ x: ball.x, y: ball.y, vx:(Math.random()-0.5)*50, vy:(Math.random()-0.5)*50, t:0.3, c:'#f4f4f4' });
}
function collideRect(o){
  const cx = Math.max(o.x0, Math.min(o.x1, ball.x)), cy = Math.max(o.y0, Math.min(o.y1, ball.y));
  const dx = ball.x - cx, dy = ball.y - cy, d2 = dx*dx + dy*dy;
  if (d2 >= BALL_R*BALL_R) return;
  let nx, ny, d;
  if (d2 < 1e-6){ // centro dentro l'ostacolo: esci dal lato più vicino
    const l = ball.x - o.x0, r = o.x1 - ball.x, b = ball.y - o.y0, t = o.y1 - ball.y, m = Math.min(l, r, b, t);
    if (m === l){ nx = -1; ny = 0; d = -l; } else if (m === r){ nx = 1; ny = 0; d = -r; }
    else if (m === b){ nx = 0; ny = -1; d = -b; } else { nx = 0; ny = 1; d = -t; }
  } else { d = Math.sqrt(d2); nx = dx/d; ny = dy/d; }
  ball.x += nx*(BALL_R - d); ball.y += ny*(BALL_R - d);
  const vn = ball.vx*nx + ball.vy*ny;
  if (vn < 0){
    const e = (o.kind === 'clima' ? 0.75 : 0.5) + (perk('FABIO') ? 0.15 : 0);
    ball.vx -= (1+e)*vn*nx; ball.vy -= (1+e)*vn*ny;
    ball.vx *= 0.95;
    if (-vn > 70){
      bounceFx();
      if (-vn > 250) popup(o.kind === 'clima' ? 'CLANG!' : 'BOING!', ball.x, ball.y + 8, '#fee761');
    }
  }
}

function spawnBirds(){
  game.birds = [];
  const L = isClimb() ? game.level : 0;
  const n = isClimb() ? (L >= 3 ? Math.min(5, Math.floor((L - 1)/2)) : 0) : Math.min(5, game.round + 1);
  const lvl = isClimb() ? L/2 : game.round;
  for (let i=0;i<n;i++){
    const sp = 22 + Math.random()*30 + lvl*6;
    game.birds.push({ x: Math.random()*W, y: 250 + Math.random()*(BRIDGE - 350), vx: Math.random()<0.5 ? sp : -sp, ph: Math.random()*6, scared: 0 });
  }
}
function hitBirds(){
  for (const b of game.birds){
    if (b.scared > 0) continue;
    const dx = ball.x - b.x, dy = ball.y - b.y;
    if (dx*dx + dy*dy < 36){
      b.scared = 3;
      if (perk('TANO')){ popup('SBAM!', b.x, b.y + 8, '#e43b44'); }
      else {
        ball.vx += (dx >= 0 ? 1 : -1) * (50 + Math.random()*50);
        ball.vy *= 0.55;
      }
      beep(1200, 0.08, 'square', 600, 0.08); setTimeout(()=>beep(1400,0.06,'square',700,0.06), 70);
      for (let i=0;i<6;i++) game.particles.push({ x:b.x, y:b.y, vx:(Math.random()-0.5)*60, vy:Math.random()*40, t:0.8, c:'#c0cbdc' });
    }
  }
}

function wallBounce(dir){
  const sp = Math.abs(ball.vx);
  const ex = perk('FABIO') ? 0.62 : 0.5, ey = perk('FABIO') ? 0.985 : 0.97;
  ball.vx = dir * sp * ex;
  if (sp > 25){ ball.vy *= ey; bounceFx(); }
}
function knockNiche(){
  const n = game.niche, prev = n.owner;
  game.falling.push({ x: nicheX(), y: NICHE_Y, vx: 30 + Math.random()*30, vy: 40, spin: 0, owner: prev });
  n.owner = -1; sfx.knock(); shake(0.2, 1.5);
  ball.vx *= 0.6; ball.vy *= 0.6;
  ball.knocked = prev;
  if (!isClimb() && prev !== game.turn){
    game.points[game.turn]++;
    popup('GIU! +1', nicheX() + 14, NICHE_Y - 6, cur().kid.shirt);
  } else popup(prev === game.turn ? 'OPS!' : 'GIU!', nicheX() + 14, NICHE_Y - 6, '#f4f4f4');
}
function wedge(){
  const n = game.niche;
  n.owner = game.turn;
  ball.x = nicheX(); ball.y = NICHE_Y; ball.vx = ball.vy = 0;
  if (!isClimb()) game.points[game.turn]++;
  for (let i=0;i<16;i++) game.particles.push({ x:ball.x, y:ball.y, vx:(Math.random()-0.2)*120, vy:-Math.random()*120, t:0.7, c: i%2 ? '#efc08a' : cur().kid.shirt });
  sfx.stuck(); shake(0.25, 2);
  endTurn({ ok: true, knocked: ball.knocked, bank: ball.bounces });
}

// ================== DISEGNO ==================
const sy = wy => H - GROUND - (wy - cam); // altezza mondo -> y schermo

function text(s, x, y, size=8, color='#f4f4f4', align='center', shadow=true){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  if (shadow){ ctx.fillStyle = '#1a1c2c'; ctx.fillText(s, x+1, y+1); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawBall(x, y, spin=0, owner=-1){
  const X = Math.round(x), Y = Math.round(y);
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(X-3, Y-4, 7, 9); ctx.fillRect(X-4, Y-3, 9, 7);
  ctx.fillStyle = '#f4f4f4'; ctx.fillRect(X-2, Y-3, 5, 7); ctx.fillRect(X-3, Y-2, 7, 5);
  ctx.fillStyle = '#1a1c2c';
  const a = ((Math.floor(spin) % 4) + 4) % 4;
  const spots = [[0,0],[-2,-2],[2,1],[-1,2]];
  const s = spots[a], s2 = spots[(a+2)%4];
  ctx.fillRect(X+s[0], Y+s[1], 1, 1); ctx.fillRect(X+s2[0], Y+s2[1], 1, 1);
  if (owner >= 0){ ctx.fillStyle = game.players[owner].kid.mark; ctx.fillRect(X-1, Y-1, 3, 2); }
}

function drawKid(x, kid, active, kicking, baseY){
  const X = Math.round(x), base = Math.round(baseY === undefined ? sy(0) : baseY);
  const px = (c, x0, y0, w = 1, h = 1) => { ctx.fillStyle = c; ctx.fillRect(x0, y0, w, h); };
  px('rgba(0,0,0,0.25)', X-5, base, 12, 2);                        // ombra
  // gambe e scarpe
  px(kid.skin, X-3, base-6, 2, 6);
  if (kicking){ px(kid.skin, X+1, base-7, 2, 3); px(kid.skin, X+3, base-9, 3, 2); }
  else px(kid.skin, X+1, base-6, 2, 6);
  px('#f4f4f4', X-3, base-3, 2, 1); if (!kicking) px('#f4f4f4', X+1, base-3, 2, 1); // calzettoni
  px('#1a1c2c', X-4, base-1, 3, 1);
  if (kicking) px('#1a1c2c', X+6, base-10, 2, 2); else px('#1a1c2c', X+1, base-1, 3, 1);
  // pantaloncini
  px(kid.shorts, X-3, base-9, 6, 3);
  if (kid.shorts === '#f4f4f4') px('#c0cbdc', X-3, base-7, 6, 1);
  // maglia
  px(kid.top, X-4, base-15, 8, 7);
  px(kid.top, X-5, base-14, 1, 3); px(kid.top, X+4, base-14, 1, 3);
  switch (kid.kit){
    case 'stripes':   // Juve: strisce verticali
      for (let k = -3; k <= 3; k += 2) px(kid.top2, X+k, base-15, 1, 7);
      px(kid.top2, X-5, base-14, 1, 3); break;
    case 'collar':    // Messina: colletto giallo a V
      px(kid.top2, X-2, base-15, 1, 1); px(kid.top2, X+1, base-15, 1, 1); px(kid.top2, X-1, base-14, 2, 1);
      px(kid.top2, X+1, base-12, 1, 1); break;
    case 'italia':    // Italia: scudetto tricolore
      px('#38b764', X+1, base-13, 1, 2); px('#f4f4f4', X+2, base-13, 1, 2); px('#e43b44', X+3, base-13, 1, 2);
      px(kid.top2, X-1, base-15, 2, 1); break;
    case 'shoulders': // nera con le spalle gialle
      px(kid.top2, X-5, base-15, 3, 1); px(kid.top2, X+2, base-15, 3, 1); px(kid.top2, X-5, base-14, 1, 1); px(kid.top2, X+4, base-14, 1, 1); break;
    case 'trim':      // bianca con bordini
      px(kid.top2, X-5, base-12, 1, 1); px(kid.top2, X+4, base-12, 1, 1); px('#3b5dc9', X-1, base-15, 2, 1);
      px('#3b5dc9', X+1, base-13, 1, 1); break;
  }
  // braccia
  if (kicking){ px(kid.skin, X-7, base-16, 2, 2); px(kid.skin, X+5, base-15, 2, 2); }
  else { px(kid.skin, X-5, base-11, 1, 2); px(kid.skin, X+4, base-11, 1, 2); }
  // testa
  px(kid.skin, X-3, base-21, 6, 6);
  px(kid.skin, X-4, base-19, 1, 2); px(kid.skin, X+3, base-19, 1, 2); // orecchie
  if (kid.bald){
    px(kid.skin, X-3, base-22, 6, 1);
    px('rgba(255,255,255,0.55)', X-1, base-22, 2, 1);                 // pelata che luccica
  } else {
    px(kid.hair, X-3, base-22, 6, 2); px(kid.hair, X-4, base-21, 1, 2);
    if (kid.hairStyle === 'long'){ px(kid.hair, X-4, base-21, 1, 4); px(kid.hair, X+3, base-21, 1, 2); px(kid.hair, X-3, base-23, 5, 1); }
    if (kid.hairStyle === 'quiff'){ px(kid.hair, X-2, base-23, 4, 1); px(kid.hair, X+1, base-24, 2, 1); }
    if (kid.hairStyle === 'short') px(kid.hair, X+2, base-23, 1, 1);
  }
  // occhi
  px('#1a1c2c', X-1, base-19, 1, 1); px('#1a1c2c', X+1, base-19, 1, 1);
  // barba
  if (kid.beardType === 'full'){ px(kid.beard, X-3, base-17, 6, 2); px(kid.beard, X-1, base-18, 3, 1); px('#b55a50', X, base-17, 1, 1); }
  else if (kid.beardType === 'stubble'){ px(kid.beard, X-3, base-16, 6, 1); px(kid.beard, X-3, base-17, 1, 1); px(kid.beard, X+2, base-17, 1, 1); }
  else px('#b55a50', X, base-17, 1, 1);
  if (active){ // freccetta sopra il giocatore di turno
    const b = Math.sin(performance.now()/150) > 0 ? 0 : 1;
    px(kid.shirt, X-2, base-31+b, 5, 1); px(kid.shirt, X-1, base-30+b, 3, 1); px(kid.shirt, X, base-29+b, 1, 1);
  }
}

function drawStreet(){
  const g = Math.round(sy(0));
  if (g >= H) return;
  ctx.fillStyle = '#8b9bb4'; ctx.fillRect(0, g, W, 6);           // marciapiede
  ctx.fillStyle = '#c0cbdc'; for (let x=0;x<W;x+=16) ctx.fillRect(x, g, 1, 6);
  ctx.fillStyle = '#5a6988'; ctx.fillRect(0, g+6, W, 2);
  ctx.fillStyle = '#3a4466'; ctx.fillRect(0, g+8, W, H-g);         // strada
  ctx.fillStyle = '#c0cbdc'; for (let x=4;x<W;x+=24) ctx.fillRect(x, g+22, 12, 2);
}

function drawMinimap(){
  const mx = W - 14, mh = 120, my = 22;
  ctx.fillStyle = 'rgba(26,28,44,0.7)'; ctx.fillRect(mx-2, my-2, 14, mh+4);
  ctx.fillStyle = '#8c6d6a'; ctx.fillRect(mx, my, 10, mh);
  const yy = wy => my + mh - wy/WALL_TOP*mh, xx = x => mx + x/W*10;
  ctx.fillStyle = '#7fb2e0'; ctx.fillRect(mx+5, my, 5, Math.round(yy(RIGHT_TOP)) - my);
  ctx.fillStyle = '#2a2130'; ctx.fillRect(Math.round(xx(W/2))-1, Math.round(yy(BRIDGE)), 2, Math.round(BRIDGE/WALL_TOP*mh));
  ctx.fillStyle = '#b0908c'; ctx.fillRect(Math.round(xx(W/2))-1, Math.round(yy(BRIDGE))-1, 6, 1);
  // l'incastro (lampeggia se è libero)
  const nx = Math.round(xx(W/2)) - 2, ny = Math.round(yy(NICHE_Y));
  if (game.niche.owner >= 0){ ctx.fillStyle = game.players[game.niche.owner].kid.shirt; ctx.fillRect(nx, ny, 3, 3); }
  else if (Math.sin(performance.now()/200) > 0){ ctx.fillStyle = '#fee761'; ctx.fillRect(nx, ny, 2, 2); }
  // giocatore e vista attuale
  ctx.fillStyle = cur().kid.shirt; ctx.fillRect(Math.round(xx(cur().x))-1, my+mh-2, 3, 3);
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 1;
  ctx.strokeRect(mx-0.5, Math.round(yy(cam + H - GROUND))+0.5, 11, Math.max(2, (H-GROUND)/WALL_TOP*mh));
}

function drawHUD(){
  // punteggi in alto
  const n = game.players.length, bw = W / n;
  if (isClimb()) drawClimbHUD(); else {
  ctx.fillStyle = 'rgba(26,28,44,0.85)'; ctx.fillRect(0, 0, W, 18);
  game.players.forEach((p, i) => {
    const x = i*bw;
    if (i === game.turn && state !== 'over'){ ctx.fillStyle = p.kid.shirt; ctx.fillRect(x, 16, bw, 2); }
    // nome sopra, altezza sotto
    text(p.kid.name, x + bw/2, 2, 6, p.kid.shirt);
    text(score(i) + (score(i) === 1 ? ' PT' : ' PT'), x + bw/2, 10, 6, '#f4f4f4');
  });
  text('ROUND ' + Math.min(game.round, menu.rounds) + '/' + menu.rounds, 4, 22, 6, '#f4f4f4', 'left');
  }
  // vento
  const wn = windNow(), wv = Math.abs(wn), dir = Math.sign(wn);
  text('VENTO', 4, 32, 6, '#c0cbdc', 'left');
  const len = Math.max(1, Math.min(34, Math.round(wv * 0.75)));

  else { ctx.fillRect(ax+36-len, ay, len, 2); ctx.fillRect(ax+35-len, ay-1, 1, 4); ctx.fillRect(ax+34-len, ay, 1, 2); }

}

function drawPowerBar(){
  const bx = 8, by = 60, bh = H - GROUND - 70;
  ctx.fillStyle = '#1a1c2c'; ctx.fillRect(bx-2, by-2, 10, bh+4);
  ctx.fillStyle = '#333c57'; ctx.fillRect(bx, by, 6, bh);
  const fh = Math.round(power * bh);
  const c = power > 0.85 ? '#e43b44' : power > 0.55 ? '#feae34' : '#38b764';
  ctx.fillStyle = c; ctx.fillRect(bx, by + bh - fh, 6, fh);
  for (let m=5; m<=20; m+=5){ const y = by + bh - (m*100/MAX_H)*bh; ctx.fillStyle='#f4f4f4'; ctx.fillRect(bx+6, Math.round(y), 2, 1); text(m+'', bx+10, Math.round(y)-3, 6, '#f4f4f4', 'left'); }
  text(meters(power*MAX_H), bx-2, by-12, 6, c, 'left');
}

function draw(){
  ctx.fillStyle = '#41a6f6'; ctx.fillRect(0,0,W,H);
  if (state === 'menu'){ drawMenu(); return; }
  if (state === 'board'){ drawBoard(); return; }
  if (state === 'select'){ drawSelect(); return; }
  ctx.save();
  if (shakeT > 0) ctx.translate(Math.round((Math.random()*2 - 1)*shakeA), Math.round((Math.random()*2 - 1)*shakeA));

  // muro
  const topWy = cam + (H - GROUND);
  const srcY = (WALL_TOP + 40) - topWy;
  ctx.drawImage(wallCv, 0, Math.round(srcY), W, H, 0, 0, W, H);
  drawStreet();

  // palloni incastrati
  if (game.niche.owner >= 0) drawBall(nicheX(), sy(NICHE_Y), 0, game.niche.owner);
  // linea di mira
  if (state === 'aim'){
    const x0 = cur().x + 5, y0 = sy(BALL_R + 2), dx = Math.sin(aimA), dy = Math.cos(aimA);
    ctx.fillStyle = 'rgba(244,244,244,0.7)';
    for (let k = 10; k < 70; k += 6) ctx.fillRect(Math.round(x0 + dx*k), Math.round(y0 - dy*k), 2, 2);
    ctx.fillStyle = '#fee761';
    ctx.fillRect(Math.round(x0 + dx*74) - 1, Math.round(y0 - dy*74) - 1, 3, 3);
  }
  // bambini
  game.players.forEach((p, i) => {
    if (i !== game.turn) drawKid(p.x, p.kid, false, false);
  });
  drawKid(cur().x, cur().kid, state==='aim', kidAnim > 0, kidJump > 0 ? sy(0) - 4 : undefined);
  drawDisturbs();
  // pallone
  for (const f of game.falling) drawBall(f.x, sy(f.y), f.spin, f.owner);
  if (state === 'aim' || state === 'flight' || (state === 'result' && !lastResult.ok)) drawBall(ball.x, sy(ball.y), ball.spin);
  // piccioni
  for (const b of game.birds){
    const X = Math.round(b.x), Y = Math.round(sy(b.y));
    if (Y < -5 || Y > H) continue;
    const f = Math.sin(game.t*(b.scared>0?40:14) + b.ph) > 0;
    const d = b.vx > 0 ? 1 : -1;
    ctx.fillStyle = '#5a6988'; ctx.fillRect(X-3, Y-1, 6, 3);
    ctx.fillStyle = '#8b9bb4'; ctx.fillRect(X-2, f ? Y-4 : Y+1, 4, f ? 3 : 2);
    ctx.fillStyle = '#5a6988'; ctx.fillRect(X + d*3 - (d<0?1:0), Y-2, 2, 2);
    ctx.fillStyle = '#feae34'; ctx.fillRect(X + d*5 - (d<0?1:0), Y-1, 1, 1);
  }
  // scritte volanti
  for (const u of game.popups) text(u.text, u.x, Math.round(sy(u.y)), 6, u.color);
  // particelle
  for (const q of game.particles){ ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x), Math.round(sy(q.y)), 2, 2); }
  // altezza durante il volo
  if (state === 'flight') text(meters(Math.max(0, ball.y)), W/2, 44, 8, '#fee761');

  ctx.restore();
  drawHUD();
  if (state === 'aim') drawPowerBar();
  if (state === 'aim' && !charging && !banner){
    const b = Math.sin(performance.now()/250) > 0;
    if (b) text('TIENI PREMUTO', W/2, H-GROUND+12, 6, '#fee761');
    text('e trascina: angolo', W/2, H-GROUND+21, 6, '#c0cbdc', 'center');
    text(game.lockX !== null ? 'posizione fissa!' : 'muovi u figghiuleddu', W/2, H-GROUND+30, 6, game.lockX !== null ? '#feae34' : '#c0cbdc', 'center');
  }
  if (state === 'result'){
    const r = lastResult;
    if (r.ok){
      text('INCASTRATO!', W/2, 70, 10, '#fee761');
      if (!isClimb()) text('+1', W/2, 86, 16, cur().kid.shirt);
      if (r.bank > 0) text(r.bank > 2 ? 'SUPER SPONDA x' + r.bank + '!' : 'DI SPONDA!', W/2, 108, 8, '#73eff7');
      if (isClimb()) text('LIVELLO SUPERATO!', W/2, 122, 8, '#38b764');
    } else {
      text('NIENTE!', W/2, 100, 12, '#e43b44');
      if (r.d < 2000) text('a ' + cm(r.d) + ' dall\'incastro', W/2, 118, 6, '#f4f4f4');
      if (isClimb()) text('-1 PALLONE', W/2, 132, 8, '#f4f4f4');
    }
    if (r.knocked >= 0 && !isClimb()){
      const k = game.players[r.knocked].kid;
      text(r.knocked === game.turn ? 'TI SEI BUTTATO GIU!' : 'HAI BUTTATO GIU', W/2, 150, 6, '#f4f4f4');
      if (r.knocked !== game.turn) text(k.name + '!', W/2, 160, 8, k.shirt);
    }
  }
  if (banner){
    ctx.fillStyle = 'rgba(26,28,44,0.88)'; ctx.fillRect(0, 118, W, 60);
    ctx.fillStyle = banner.color; ctx.fillRect(0, 118, W, 2); ctx.fillRect(0, 176, W, 2);
    if (banner.kid){ ctx.save(); ctx.scale(2, 2); drawKid(11, banner.kid, false, false, 86); ctx.restore(); }
    text(banner.text, W/2 + 16, banner.sub ? 136 : 144, 8, banner.color);
    if (banner.sub) text(banner.sub, W/2 + 16, 152, 6, '#f4f4f4');
  }
  if (state === 'over') drawOver();
}

// ================== SCALATA (giocatore singolo) ==================
const PERKS = {
  UCA:    ['UN PALLONE IN PIU', 'parte con 4 palloni'],
  FABIO:  ['EFFETTO', 'tiri piu angolati e sponde migliori'],
  TANO:   ['PALLA PESANTE', 'i piccioni non lo deviano, ma la barra trema'],
  GIAMMY: ['PRECISIONE', 'la barra di potenza va piu lenta'],
  PASO:   ['RESISTENTE', 'il vento lo sposta la meta'],
};
const INTRO = { signora: 4, car: 6, dog: 8 };
let climbSel = 0;
let climbBest = {};
try { climbBest = JSON.parse(localStorage.getItem('spacca_scalata') || '{}') || {}; } catch(e){ climbBest = {}; }

const isClimb = () => !!(game && game.mode === 'climb');
function perk(name){ return isClimb() && game.players[0].kid.name === name; }
function maxAngle(){ return perk('FABIO') ? 0.62 : MAX_ANGLE; }

function newClimb(){
  makeGame('climb');
  game.players.push({ kid: KIDS[climbSel], home: gapC(0) + 4, x: gapC(0) + 4, gx: gapC(0) + 4 });
  game.points.push(0); game.closest.push(Infinity);
  game.level = 1;
  game.lives = KIDS[climbSel].name === 'UCA' ? 4 : 3;
  setupLevel();
  startTurn();
}
function setupLevel(){
  const L = game.level;
  game.gapScale = Math.max(0.8, 1 - (L-1)*0.015);
  game.niche.owner = -1;
  game.falling = [];
  // dal livello 3 la posizione nel vialetto la decide il gioco: sempre più lontano dall'incastro
  game.lockX = null;
  if (L >= 3){
    const lo = kidMin(), hi = kidMax(), far = Math.min(1, 0.35 + (L - 3)*0.08);
    game.lockX = lo + (hi - lo) * (far*0.5 + Math.random()*far*0.5);
  }
  buildWall();
}
function climbTurnSetup(){
  const L = game.level;
  wind = (Math.random()*2 - 1) * Math.min(50, (L-1)*5);
  gustAmp = Math.max(0, Math.min(25, (L-3)*3));
  if (perk('PASO')){ wind *= 0.5; gustAmp *= 0.5; }
  setupDisturbs(L);
  let sub = game.lockX !== null ? 'TIRI DA QUI!' : 'INCASTRALO!';
  if (L === INTRO.signora) sub = 'OCCHIO ALLA SIGNORA!';
  if (L === INTRO.car) sub = 'ARRIVA LA MACCHINA!';
  if (L === INTRO.dog) sub = 'ATTENTI AL CANE!';

let dist = {};
let shakeT = 0, shakeA = 0, kidJump = 0;
function shake(t, a){ shakeT = Math.max(shakeT, t); shakeA = Math.max(shakeA, a); }
function setupDisturbs(L){
  dist = {};
  const roll = k => L === INTRO[k] || (L > INTRO[k] && Math.random() < Math.min(0.85, 0.35 + (L - INTRO[k])*0.07));
  if (roll('signora')) dist.signora = { side: Math.random() < 0.5 ? -1 : 1, t: 1.0 + Math.random()*1.8, yell: 0 };
  if (roll('car')) dist.car = { t: 0, beat: 0, side: Math.random() < 0.5 ? -1 : 1 };
  if (roll('dog')){
    const side = Math.random() < 0.5 ? -1 : 1;
    dist.dog = { side, x: side < 0 ? -14 : W + 14, tx: side < 0 ? 26 + Math.random()*30 : W - 26 - Math.random()*30, phase: 'walk', t: 1.2 + Math.random()*2, anim: 0 };
  }
}
// spavento: il bambino sobbalza e il tiro si scombina
function startle(strength){
  kidJump = 0.35;
  aimA = Math.max(-maxAngle(), Math.min(maxAngle(), aimA + (Math.random() - 0.5)*0.4*strength));
  if (charging){
    chargeT += sweepTime() * (0.3 + Math.random()*0.7) * strength;
    game.chargeBoost = 1.2;
  }
  shake(0.3, 2);
}
function speak(txt, pitch, rate){
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'it-IT'; u.pitch = pitch; u.rate = rate; u.volume = 1;
    speechSynthesis.speak(u);
  } catch(e){}
}
function sndBass(){
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.2);
  g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.3);
  beep(55, 0.16, 'triangle', 52, 0.12);
}
function sndBark(){
  if (!ac) return;
  const one = (delay) => {
    const t = ac.currentTime + delay, len = 0.12;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate*len), ac.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1) * (1 - i/d.length);
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 3;
    g.gain.setValueAtTime(0.9, t);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t);
    const o = ac.createOscillator(), g2 = ac.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(260, t + 0.1);
    g2.gain.setValueAtTime(0.08, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g2); g2.connect(ac.destination); o.start(t); o.stop(t + 0.13);
  };
  one(0); one(0.22);
}
function sndOuu(){
  beep(620, 0.9, 'sawtooth', 260, 0.05);
  speak('Ouuuuuu! A finemu cu stu palluni?!', 1.5, 1.05);
}
function updateDisturbs(dt){
  if (dist.signora && dist.signora.yell > 0) dist.signora.yell -= dt;
  if (state !== 'aim' || banner) return;
  const s = dist.signora;
  if (s){
    s.t -= dt;
    if (s.t <= 0){ s.yell = 2.2; s.t = 3.2 + Math.random()*3; sndOuu(); startle(1); }
  }
  const c = dist.car;
  if (c){
    c.t += dt;
    if (c.t >= 0.47){
      c.t -= 0.47; c.beat++;
      sndBass(); shake(0.12, 1.5);
      aimA = Math.max(-maxAngle(), Math.min(maxAngle(), aimA + (Math.random() - 0.5)*0.12));
      if (charging) chargeT += (Math.random() - 0.5) * 0.14 * sweepTime();
    }
  }
  const d = dist.dog;
  if (d){
    d.anim += dt;
    if (d.phase === 'walk'){
      d.x += Math.sign(d.tx - d.x) * 40 * dt;
      if (Math.abs(d.x - d.tx) < 1){ d.phase = 'idle'; }
    } else {
      d.t -= dt;
      if (d.phase === 'idle' && d.t <= 0.8){ d.phase = 'growl'; beep(70, 0.8, 'sawtooth', 60, 0.06); }
      if (d.phase === 'growl' && d.t <= 0){
        d.phase = 'bark'; d.t = 0.6; sndBark();
        popup('BAU! BAU!', d.x, 26, '#f4f4f4');
        if (charging){ // salto per lo spavento: parte il tiro!
          charging = false; ptr = null; kidJump = 0.35; shake(0.3, 2);
          popup('AAAH!', cur().x, 34, cur().kid.shirt);
          kick();
        } else startle(1);
      } else if (d.phase === 'bark' && d.t <= 0){ d.phase = 'idle'; d.t = 2.6 + Math.random()*2.4; }
    }
  }
}

  button('GIOCA!', W/2 - 78, 242, 74, 24, () => { audio(); sfx.kick(); newGame(); }, '#e43b44');
  button('SCALATA', W/2 + 4, 242, 74, 24, () => { audio(); state = 'select'; sfx.tick(); }, '#b55088');
  button('CLASSIFICA', W/2 - 50, 274, 100, 18, () => { audio(); openBoard('menu'); }, '#3b5dc9');
  if (online.list && online.list.length && online.listMode === 'tiri') text('TOP: ' + online.list[0].name + ' ' + online.list[0].score + ' INC', W/2, 300, 6, '#fee761', 'center', true);
  else if (best > 0) text('RECORD SOLO ' + best + ' INC', W/2, 300, 6, '#fee761', 'center', true);
  text('Incastralo più in alto!', W/2, 140, 6, '#f4f4f4', 'center', true);
}

function drawOver(){
  if (isClimb()){ drawClimbOver(); return; }
  buttons = [];
  ctx.fillStyle = 'rgba(26,28,44,0.9)'; ctx.fillRect(10, 60, W-20, 200);
  const ranking = game.players.map((p, i) => ({ p, i, s: score(i), d: game.closest[i] })).sort((a,b) => (b.s - a.s) || (a.d - b.d));
  if (game.players.length > 1){
    const top = ranking[0];
    const tie = ranking.length > 1 && ranking[1].s === top.s && ranking[1].d === top.d;
    text(tie ? 'PAREGGIO!' : 'VINCE', W/2, 72, 10, '#fee761');
    if (!tie){
      text(top.p.kid.name, W/2 + 10, 88, 14, top.p.kid.shirt);
      const jump = Math.abs(Math.sin(performance.now()/200)) * 3;
      ctx.save(); ctx.scale(2, 2); drawKid(13, top.p.kid, false, jump > 2, 54 - jump); ctx.restore();
    }
  } else {
    text('FINE!', W/2, 72, 12, '#fee761');
    text(score(0) + ' INCASTRI', W/2, 90, 12, KIDS[0].shirt);
    text('RECORD ' + best, W/2, 108, 6, '#f4f4f4');
  }
  ranking.forEach((r, k) => {
    const y = 120 + k*14;
    text((k+1) + '.', 30, y, 8, '#f4f4f4', 'left');
    ctx.fillStyle = r.p.kid.shirt; ctx.fillRect(50, y, 8, 8);
    text(r.p.kid.name, 62, y, 6, '#f4f4f4', 'left');
    text(r.s + ' PT', W-24, y, 8, r.p.kid.shirt, 'right');
  });
  if (ONLINE && ranking.some(r => r.s > 0)){
    if (online.saved) button('CLASSIFICA', W/2 - 50, 188, 100, 16, () => openBoard('over'), '#3b5dc9');
    else button(online.msg || 'SALVA RECORD', W/2 - 70, 188, 140, 16, () => { saveScores(); }, '#3b5dc9');
  }
  button('RIGIOCA', W/2 - 50, 210, 100, 20, () => { newGame(); });
  button('MENU', W/2 - 50, 236, 100, 18, () => { state = 'menu'; }, '#5a6988');
}

// ================== INPUT ==================
let ptr = null;
function toGame(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toGame(e);
  if (state === 'menu' || state === 'over' || state === 'board' || state === 'select'){
    for (const b of buttons) if (p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ b.onTap(); return; }
    return;
  }
  if (state === 'aim'){
    if (banner) banner = null;
    const kx = cur().x, ky = sy(0);
    const onKid = Math.abs(p.x - kx) < 14 && p.y > ky - 32 && p.y < ky + 12;
    ptr = { id: e.pointerId, x: p.x, move: onKid };
    if (!onKid){ charging = true; chargeT = 0; power = 0; }
    try { cv.setPointerCapture(e.pointerId); } catch(_){}
  }
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id || state !== 'aim') return;
  const p = toGame(e);
  const pl = cur();
  if (ptr.move){
    if (game.lockX === null) pl.x = Math.max(kidMin(), Math.min(kidMax(), pl.x + (p.x - ptr.x)));
    ball.x = ballStartX();
  } else {
    aimA = Math.max(-maxAngle(), Math.min(maxAngle(), aimA + (p.x - ptr.x)*0.012));
  }
  ptr.x = p.x;
});
function release(e){
  if (!ptr || e.pointerId !== ptr.id) return;
  ptr = null;
  if (state === 'aim' && charging){ charging = false; kick(); }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
window.addEventListener('keydown', e => { // tastiera per PC
  if (state !== 'aim') return;
  if (e.code === 'ArrowLeft' && game.lockX === null){ cur().x = Math.max(kidMin(), cur().x - 2); ball.x = ballStartX(); }
  if (e.code === 'ArrowRight' && game.lockX === null){ cur().x = Math.min(kidMax(), cur().x + 2); ball.x = ballStartX(); }
  if (e.code === 'KeyA') aimA = Math.max(-maxAngle(), aimA - 0.04);
  if (e.code === 'KeyD') aimA = Math.min(maxAngle(), aimA + 0.04);
  if (e.code === 'Space' && !charging){ audio(); banner = null; charging = true; chargeT = 0; }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' && state === 'aim' && charging){ charging = false; kick(); } });

// ================== LOOP ==================
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (game && state !== 'menu' && state !== 'board' && state !== 'select') update(dt);
  draw();
  requestAnimationFrame(loop);
}
window.addEventListener('resize', resize);
resize();
if (ONLINE) loadBoard();
requestAnimationFrame(loop);
</script>
